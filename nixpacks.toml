[phases.setup]
nixPkgs = ['php82', 'php82Extensions.curl', 'php82Extensions.mbstring', 'php82Extensions.xml', 'php82Extensions.zip', 'php82Extensions.mysql', 'composer', 'nodejs-18_x']

[phases.install]
cmds = [
  "composer install --no-dev --optimize-autoloader",
  "npm install && npm run build"
]

[start]
cmd = "php artisan migrate --force && php artisan serve --host=0.0.0.0 --port=${PORT:-8000}"