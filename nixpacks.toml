[phases.setup]
nixPkgs = [
  "php82",
  "php82Extensions.curl",
  "php82Extensions.mbstring",
  "php82Extensions.xml",
  "php82Extensions.zip",
  "php82Extensions.mysql",
  "php82Extensions.pdo",
  "php82Extensions.tokenizer",
  "php82Extensions.ctype",
  "php82Extensions.fileinfo",
  "php82Extensions.bcmath",
  "composer",
  "nodejs-18_x"
]

[phases.install]
cmds = [
  "composer install --no-dev --optimize-autoloader",
  "npm install && npm run build"
]

[phases.build]
nixLayers = ["php", "composer", "nodejs"]

# Hapus bagian nixOverlays yang bermasalah
# [phases.build.nixOverlays]
# "https://github.com/railwayapp/nix-npm-overlay/archive/main.tar.gz" = "nodePackages"

[start]
cmd = "php artisan migrate --force && php artisan"